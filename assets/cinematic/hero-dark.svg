<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="heroDarkTitle heroDarkDesc">
  <title id="heroDarkTitle">Cinematic hero frame in dark mode</title>
  <desc id="heroDarkDesc">Deep charcoal background with a luminous #C1121F band and subtle stars floating above.</desc>
  <defs>
    <linearGradient id="darkBase" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#050505"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
  </defs>
  <rect width="900" height="450" fill="url(#darkBase)"/>
  <rect x="80" y="90" width="740" height="270" rx="35" ry="35" fill="rgba(255,255,255,0.03)" stroke="#2b2b2b" stroke-width="2"/>
  <rect x="130" y="200" width="640" height="110" rx="20" fill="#C1121F"/>
  <circle cx="780" cy="90" r="20" fill="#fff" opacity="0.4"/>
  <circle cx="150" cy="130" r="12" fill="#fff" opacity="0.3"/>
  <circle cx="260" cy="340" r="16" fill="#fff" opacity="0.2"/>
</svg>
